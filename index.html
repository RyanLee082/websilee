<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時物件偵測掃描</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        :root {
            --primary-color: #2196F3; /* 改個顏色區分，這是科技藍 */
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .active { display: block; }

        /* 按鈕樣式 */
        .home-btn-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 80vh;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 圖鑑樣式 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-bottom: 50px;
        }

        .card-item {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .card-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 浮動視窗 */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .modal-img {
            width: 100%;
            max-width: 200px;
            display: block;
            margin: 0 auto 15px auto;
        }

        /* 掃描頁面專用樣式 (重疊 Video 和 Canvas) */
        #cam-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px; /* 限制相機寬度 */
            margin: 0 auto 20px auto;
            border-radius: 15px;
            overflow: hidden;
            background: black;
            aspect-ratio: 3/4; /* 預設比例，避免載入前塌陷 */
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Canvas 在 Video 上方 */
        }

        /* 結果頁面圖片 */
        #result-snapshot {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            border: 3px solid var(--primary-color);
        }
        
        .back-btn { background-color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="home-page" class="page active">
        <h1>物件偵測掃描器</h1>
        <div class="home-btn-container">
            <button onclick="goToGallery()">卡牌圖鑑</button>
            <button onclick="goToScanner()">啟動相機 (COCO-SSD)</button>
        </div>
    </div>

    <div id="gallery-page" class="page">
        <h2>卡牌圖鑑</h2>
        <div class="gallery-grid" id="gallery-grid"></div>
        <button class="back-btn" onclick="goHome()">返回首頁</button>
    </div>

    <div id="scan-page" class="page">
        <h2>即時偵測中</h2>
        
        <div id="cam-wrapper">
            <video id="webcam" playsinline muted autoplay></video>
            <canvas id="overlay"></canvas>
        </div>

        <div id="loading-text">正在載入 COCO-SSD 模型...</div>
        <div id="status-text" style="color: #666; margin-bottom: 10px; height: 1.2em;"></div>
        
        <button id="scan-btn" onclick="captureAndResult()" disabled>拍照並查看結果</button>
        <br><br>
        <button class="back-btn" onclick="stopWebcamAndGoHome()">返回首頁</button>
    </div>

    <div id="result-page" class="page">
        <h2>偵測結果 snapshot</h2>
        <img id="result-snapshot" src="">
        
        <div class="modal-content" style="margin: 0 auto; background: rgba(255,255,255,0.9);">
            <h3>偵測到的物件：</h3>
            <div id="result-list" style="font-size: 1.1rem; color: #333;"></div>
            <p style="font-size: 0.8rem; color: #999; margin-top: 15px;">
                * COCO-SSD 為通用模型，可能將卡牌誤判為 book, cell phone 等物品。
            </p>
        </div>
        <br>
        <button onclick="goToScanner()">重新掃描</button>
        <button class="back-btn" onclick="goHome()">返回首頁</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img-display" class="modal-img" src="">
            <div id="modal-desc" style="line-height: 1.6;"></div>
        </div>
    </div>

    <script>
        // --- 圖鑑資料 (不變) ---
        const cardData = [
            { id: 1, desc: "屬性:草 編號: 0406 卡包: M2aF 進化標記:基礎" },
            { id: 2, desc: "屬性:寶可夢道具 卡包:M2aF" },
            { id: 3, desc: "屬性:支援者 卡包:M2aF" },
            { id: 4, desc: "屬性:龍 編號:0887 卡包:M2aF 進化標記:太晶EX" },
            { id: 5, desc: "屬性:龍 編號:0886 卡包:M2aF 進化標記:1階進化" },
            { id: 6, desc: "屬性:龍 編號:0885 卡包:M2aF 進化標記:基礎" },
            { id: 7, desc: "屬性:龍 編號:0148 卡包:M2aF 進化標記:1階進化" },
            { id: 8, desc: "屬性:龍 編號:0149 卡包:M2aF 進化標記:超級進化EX" },
            { id: 9, desc: "屬性:龍 編號:0147 卡包:M2aF 進化標記:基礎" },
            { id: 10, desc: "屬性:電 編號:0603 卡包:M2aF 進化標記:1階進化" },
            { id: 11, desc: "屬性:電 編號:0602 卡包:M2aF 進化標記:基礎" },
            { id: 12, desc: "屬性:電 編號:0604 卡包:M2aF 進化標記:超級進化EX" }
        ];

        // --- 變數宣告 ---
        let model = undefined;
        let videoStream = null;
        let animationId = null;
        let lastPredictions = []; // 儲存最新的偵測結果

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');

        // --- 頁面控制 ---
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function goHome() {
            stopWebcam();
            showPage('home-page');
        }

        // --- 圖鑑功能 (不變) ---
        function goToGallery() {
            const grid = document.getElementById('gallery-grid');
            if(grid.innerHTML === '') {
                cardData.forEach(card => {
                    const div = document.createElement('div');
                    div.className = 'card-item';
                    div.innerHTML = `<img src="${card.id}.png" alt="Card ${card.id}">`;
                    div.onclick = () => openModal(card);
                    grid.appendChild(div);
                });
            }
            showPage('gallery-page');
        }

        function openModal(card) {
            document.getElementById('modal-img-display').src = `${card.id}.png`;
            document.getElementById('modal-desc').innerText = card.desc;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        // --- COCO-SSD 核心邏輯 ---

        async function initModel() {
            if (!model) {
                // 載入 COCO-SSD 模型
                model = await cocoSsd.load();
                console.log("COCO-SSD Model Loaded");
                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('scan-btn').disabled = false;
            }
        }

        async function goToScanner() {
            showPage('scan-page');
            document.getElementById('scan-btn').disabled = true;
            document.getElementById('loading-text').style.display = 'block';

            // 1. 啟動 WebCam (使用原生 API)
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: { facingMode: "environment" } // 優先使用後鏡頭
                    });
                    video.srcObject = videoStream;
                    
                    // 等待影片 metadata 載入完畢以取得正確尺寸
                    video.onloadedmetadata = () => {
                        video.play();
                        // 設定 Canvas 尺寸與 Video 實際解析度一致
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        // 2. 載入模型並開始偵測
                        initModel().then(() => {
                            detectFrame();
                        });
                    };
                } catch (err) {
                    alert("無法存取相機，請確認權限或使用 HTTPS 連線。");
                    console.error(err);
                }
            }
        }

        function detectFrame() {
            if (!model || video.paused || video.ended) return;

            model.detect(video).then(predictions => {
                lastPredictions = predictions; // 存下來供拍照用
                renderPredictions(predictions);
                animationId = requestAnimationFrame(detectFrame);
            });
        }

        function renderPredictions(predictions) {
            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 確保 Canvas 尺寸跟隨 Video (響應式視窗調整)
            if(canvas.width !== video.videoWidth || canvas.height !== video.videoHeight){
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            const font = "16px sans-serif";
            ctx.font = font;
            ctx.textBaseline = "top";

            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                const text = `${prediction.class} (${Math.round(prediction.score * 100)}%)`;

                // 1. 畫框框
                ctx.strokeStyle = "#00FFFF";
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, width, height);

                // 2. 畫文字背景
                const textWidth = ctx.measureText(text).width;
                ctx.fillStyle = "#00FFFF";
                ctx.fillRect(x, y, textWidth + 8, 24);

                // 3. 畫文字
                ctx.fillStyle = "#000000";
                ctx.fillText(text, x + 4, y + 4);
            });
            
            // 更新狀態文字
            const statusDiv = document.getElementById('status-text');
            if (predictions.length > 0) {
                statusDiv.innerText = `偵測到: ${predictions.map(p => p.class).join(', ')}`;
            } else {
                statusDiv.innerText = "搜尋物件中...";
            }
        }

        function stopWebcam() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
        
        function stopWebcamAndGoHome() {
            stopWebcam();
            goHome();
        }

        // --- 拍照與結果呈現 ---
        function captureAndResult() {
            // 1. 暫停偵測 loop
            if (animationId) cancelAnimationFrame(animationId);
            
            // 2. 將目前的 Video + Canvas 畫框 合成為一張圖
            // 這裡為了簡單，我們創建一個暫時的 canvas 來合併
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            // 畫入影片當前影格
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            // 畫入當前的框框 (從 overlay canvas 複製)
            tempCtx.drawImage(canvas, 0, 0);

            // 轉成圖片 URL
            const dataURL = tempCanvas.toDataURL('image/png');
            document.getElementById('result-snapshot').src = dataURL;

            // 3. 顯示偵測文字結果
            const resultList = document.getElementById('result-list');
            if (lastPredictions.length > 0) {
                const listItems = lastPredictions.map(p => 
                    `<li><strong>${p.class}</strong>: ${Math.round(p.score*100)}% 信心</li>`
                ).join('');
                resultList.innerHTML = `<ul>${listItems}</ul>`;
            } else {
                resultList.innerHTML = "<p>畫面中未偵測到已知物件。</p>";
            }

            // 4. 停止相機並切換頁面
            stopWebcam();
            showPage('result-page');
        }
    </script>
</body>
</html>
